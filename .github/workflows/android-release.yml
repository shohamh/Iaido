name: Android release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'nightly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Resolve release version
        run: |
          base_version="$(sed -n 's/^iaidoVersion=//p' gradle.properties)"
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            test "${GITHUB_REF_NAME#v}" = "$base_version"
            echo "IAIDO_VERSION=$base_version" >> "$GITHUB_ENV"
          else
            echo "IAIDO_VERSION=${base_version}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "IAIDO_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iaido-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/iaido-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PiaidoVersion="$IAIDO_VERSION" \
            -PiaidoVersionCode="$IAIDO_VERSION_CODE" \
            --no-daemon --console=plain
      - name: Verify release APK identity and signature
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "package: name='com.iaido.app'"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --verify-tag --generate-notes
          else
            nightly_timestamp="$(TZ=Asia/Jerusalem date +%Y%m%d%H%M)"
            nightly_tag="nightly-$nightly_timestamp"
            nightly_readable="$(TZ=Asia/Jerusalem date +'%d.%m.%Y %H:%M')"
            nightly_title="Iaido Nightly $nightly_readable"

            previous_nightly_tag="$(git tag -l 'nightly-????????????' | sort | tail -n 1)"
            if [ -n "$previous_nightly_tag" ]; then
              changelog="$(git log --pretty='- %h %s' "${previous_nightly_tag}..HEAD")"
            else
              changelog=""
            fi
            if [ -z "$changelog" ]; then
              changelog="No changes since the previous nightly."
            fi

            nightly_notes="$(printf 'Automated nightly build from main commit %s.\nReleased: %s.\n\n### Changes since previous nightly\n%s' "$GITHUB_SHA" "$nightly_readable" "$changelog")"

            gh release create "$nightly_tag" app/build/outputs/apk/release/app-release.apk \
              --target "$GITHUB_SHA" \
              --title "$nightly_title" \
              --prerelease \
              --notes "$nightly_notes"

            # Keep the old fixed tag working for already-installed nightly builds.
            if gh release view nightly >/dev/null 2>&1; then
              gh release upload nightly app/build/outputs/apk/release/app-release.apk --clobber
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
                -F "sha=$GITHUB_SHA" \
                -F "force=true"
              legacy_notes="$(printf 'Compatibility alias for %s, built from main commit %s. Use the timestamped nightly releases for history.\nReleased: %s.\n\n### Changes since previous nightly\n%s' "$nightly_tag" "$GITHUB_SHA" "$nightly_readable" "$changelog")"
              gh release edit nightly \
                --target "$GITHUB_SHA" \
                --title "Legacy Iaido Nightly alias ($nightly_readable)" \
                --notes "$legacy_notes" \
                --prerelease
            fi
          fi
