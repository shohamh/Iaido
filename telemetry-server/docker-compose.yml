services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iaido_telemetry
      POSTGRES_USER: iaido
      POSTGRES_PASSWORD: ${IAIDO_POSTGRES_PASSWORD:?set IAIDO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaido -d iaido_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # SeaweedFS stands in for S3 locally: MinIO's public images are no longer pullable (quay.io
  # returns 401, Docker Hub has none). It speaks the S3 API incl. conditional puts
  # (`If-None-Match: *`), which `S3ObjectStorage.put_if_absent` relies on. Local dev only: it
  # accepts any credentials, so never expose port 9000. Production points IAIDO_S3_* at real S3.
  s3:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["weed"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-ip.bind=0.0.0.0"]
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${IAIDO_S3_ACCESS_KEY:?set IAIDO_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${IAIDO_S3_SECRET_KEY:?set IAIDO_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -ec
      - >-
        for i in $$(seq 1 30); do
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket iaido-telemetry && exit 0;
        aws --endpoint-url http://s3:9000 s3 mb s3://iaido-telemetry && exit 0;
        sleep 2; done; exit 1

  telemetry:
    build: .
    image: iaido-telemetry:local
    # `--forwarded-allow-ips=*` is required behind the reverse proxy that terminates TLS: the
    # proxy connects from the Docker gateway (not 127.0.0.1), so uvicorn's default trust list
    # would drop the proxy's `X-Forwarded-Proto: https` and every `/v1/` request would be
    # rejected with 426 by IngestionBoundaryMiddleware. The published port is loopback-only,
    # so only a proxy on this host can reach it. Source is baked into the image (no bind mount,
    # which Docker Desktop on Windows can refuse); use docker-compose.hotreload.yml for reload.
    command: >-
      uvicorn iaido_telemetry.app:create_app --factory --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    environment:
      IAIDO_DATABASE_URL: postgresql+psycopg://iaido:${IAIDO_POSTGRES_PASSWORD}@postgres:5432/iaido_telemetry
      IAIDO_S3_ENDPOINT_URL: http://s3:9000
      IAIDO_S3_BUCKET: iaido-telemetry
      IAIDO_S3_ACCESS_KEY: ${IAIDO_S3_ACCESS_KEY}
      IAIDO_S3_SECRET_KEY: ${IAIDO_S3_SECRET_KEY}
      IAIDO_S3_REGION: ${IAIDO_S3_REGION:-us-east-1}
      IAIDO_OPERATOR_TOKEN: ${IAIDO_OPERATOR_TOKEN:?set IAIDO_OPERATOR_TOKEN in the server environment}
      IAIDO_DASHBOARD_USERNAME: ${IAIDO_DASHBOARD_USERNAME:-iaido}
      IAIDO_DASHBOARD_PASSWORD: ${IAIDO_DASHBOARD_PASSWORD:-}
      IAIDO_MAX_REQUEST_BYTES: ${IAIDO_MAX_REQUEST_BYTES:-262144}
      IAIDO_RATE_LIMIT_REQUESTS: ${IAIDO_RATE_LIMIT_REQUESTS:-120}
      IAIDO_RATE_LIMIT_WINDOW_SECONDS: ${IAIDO_RATE_LIMIT_WINDOW_SECONDS:-60}
      IAIDO_RATE_LIMIT_MAX_BUCKETS: ${IAIDO_RATE_LIMIT_MAX_BUCKETS:-10000}
    ports:
      - "127.0.0.1:${IAIDO_TELEMETRY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
