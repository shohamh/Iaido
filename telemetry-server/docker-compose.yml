services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iaido_telemetry
      POSTGRES_USER: iaido
      POSTGRES_PASSWORD: ${IAIDO_POSTGRES_PASSWORD:?set IAIDO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaido -d iaido_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${IAIDO_S3_ACCESS_KEY:?set IAIDO_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${IAIDO_S3_SECRET_KEY:?set IAIDO_S3_SECRET_KEY}
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${IAIDO_S3_ACCESS_KEY:?set IAIDO_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${IAIDO_S3_SECRET_KEY:?set IAIDO_S3_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -ec
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing local/iaido-telemetry

  telemetry:
    image: python:3.13-slim
    working_dir: /service
    command:
      - /bin/sh
      - -ec
      - pip install --no-cache-dir -e . && uvicorn iaido_telemetry.app:create_app --factory --host 0.0.0.0 --port 8000 --proxy-headers
    environment:
      IAIDO_DATABASE_URL: postgresql+psycopg://iaido:${IAIDO_POSTGRES_PASSWORD}@postgres:5432/iaido_telemetry
      IAIDO_S3_ENDPOINT_URL: http://minio:9000
      IAIDO_S3_BUCKET: iaido-telemetry
      IAIDO_S3_ACCESS_KEY: ${IAIDO_S3_ACCESS_KEY}
      IAIDO_S3_SECRET_KEY: ${IAIDO_S3_SECRET_KEY}
      IAIDO_S3_REGION: ${IAIDO_S3_REGION:-us-east-1}
      IAIDO_OPERATOR_TOKEN: ${IAIDO_OPERATOR_TOKEN:?set IAIDO_OPERATOR_TOKEN in the server environment}
      IAIDO_MAX_REQUEST_BYTES: ${IAIDO_MAX_REQUEST_BYTES:-262144}
      IAIDO_RATE_LIMIT_REQUESTS: ${IAIDO_RATE_LIMIT_REQUESTS:-120}
      IAIDO_RATE_LIMIT_WINDOW_SECONDS: ${IAIDO_RATE_LIMIT_WINDOW_SECONDS:-60}
      IAIDO_RATE_LIMIT_MAX_BUCKETS: ${IAIDO_RATE_LIMIT_MAX_BUCKETS:-10000}
    volumes:
      - .:/service:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
