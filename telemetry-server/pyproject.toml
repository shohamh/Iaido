[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iaido-telemetry"
version = "0.1.0"
description = "First-party Iaido telemetry ingestion service"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.110,<1",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
